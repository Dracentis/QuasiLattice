[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "quasilattice"
version = "0.4.3"
authors = [
  { name="Kaedon Cleland-Host", email="kaedon@kaedon.net" },
]
description = "A data analysis, knowledge base, journaling and note taking system."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "nh3",
    "pwdlib",
    "PyJWT",
    "pypandoc",
    "rfc8785",
    "zstandard",
    "pydantic",
    "markdown-it-py",
    "pwdlib[argon2]"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Dracentis/QuasiLattice"
Issues = "https://github.com/Dracentis/QuasiLattice/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quasilattice"]

[project.scripts]
quasilattice = "quasilattice.cli:main"

[tool.fastapi]
entrypoint = "quasilattice.api:app"

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
ignore = ["EXE001","EXE002"]
